output_dir: ./outputs/deim_hgnetv2_s_m3ot_ir_infer

model: DEIM
postprocessor: PostProcessor

num_classes: 1
use_focal_loss: True
remap_mscoco_category: False

DEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer

HGNetv2:
  name: 'B0'
  in_channels: 1
  pretrained: False
  use_lab: True
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

DFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 3
  eval_idx: -1
  num_queries: 300
  reg_max: 32
  reg_scale: 4

PostProcessor:
  num_top_queries: 300