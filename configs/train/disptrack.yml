criterion: DEIMCriterion
DEIMCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_mal: 1
  losses:
  - mal
  - boxes
  - local
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*(?:backbone_rgb|fusion))(?!.*(bn|norm)).*$
    lr: 0.0002
  - params: ^(?=.*backbone_ir)(?!.*(bn|norm)).*$
    lr: 2.0e-05
  - params: ^(?=.*(?:encoder_ir|decoder_ir))(?!.*(bn|norm)).*$
    lr: 0.0004
  - params: ^(?=.*(?:norm|bn)).*$
    weight_decay: 0.0
  lr: 0.0004
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
epoches: 72
flat_epoch: 40
no_aug_epoch: 12
warmup_iter: 2000
lr_gamma: 0.5
clip_max_norm: 0.1
train_dataloader:
  type: DataLoader
  dataset:
    type: DualModalCocoDetection
    ann_file: SET_BY_TRAIN_CLI
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch:
        - 8
        - 40
        - 64
        ops:
        - Mosaic
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
      mosaic_prob: 0.5
    img_folder_rgb: SET_BY_TRAIN_CLI
    img_folder_ir: SET_BY_TRAIN_CLI
    ann_file_ir: SET_BY_TRAIN_CLI
    ir_channels: 1
    remap_mscoco_category: true
  shuffle: true
  num_workers: 4
  drop_last: true
  pin_memory: true
  collate_fn:
    type: DualModalBatchImageCollateFunction
    base_size: 640
    base_size_repeat: 20
    stop_epoch: 64
    ema_restart_decay: 0.9999
  total_batch_size: 20
val_dataloader:
  type: DataLoader
  dataset:
    type: DualModalCocoDetection
    ann_file: SET_BY_TRAIN_CLI
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
    img_folder_rgb: SET_BY_TRAIN_CLI
    img_folder_ir: SET_BY_TRAIN_CLI
    ann_file_ir: SET_BY_TRAIN_CLI
    ir_channels: 1
    remap_mscoco_category: true
  shuffle: false
  num_workers: 4
  drop_last: false
  pin_memory: true
  collate_fn:
    type: DualModalBatchImageCollateFunction
  total_batch_size: 16
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
__include__:
- ../release/deim_hgnetv2_m3ot_dual_v12_infer.yml
freeze_ir_branch: true
use_amp: true
use_ema: true
cache_imgsz: null
ram_cache: false
remap_mscoco_category: true
